name: CI

on:
  pull_request:
  push:
    branches: [main, fase-2, fase-2-paso-1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (R13)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: SQLite minimum version
        # El DDL de la spec usa funciones de ventana (3.25) e índices por expresión (3.9).
        run: |
          uv run python - <<'PY'
          import sqlite3
          print("sqlite", sqlite3.sqlite_version)
          assert sqlite3.sqlite_version_info >= (3, 25, 0), sqlite3.sqlite_version
          PY
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        run: uv run pytest
